name: CodeQL

# Code scanning is free for public repositories. It complements the unit tests: it
# follows tainted data into the host's file and RPC handlers instead of checking
# behaviour one endpoint at a time.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      # JavaScript needs no compilation; the extractor reads the sources directly.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
