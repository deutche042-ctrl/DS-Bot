name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"

  app:
    name: Desktop app profile
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mobile:
    name: Phone app typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  link:
    name: Phone link and Relay Server
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
